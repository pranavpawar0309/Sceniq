<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="32" fill="#08080f"/>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="26" stroke="#e8c56d" stroke-width="2.5" fill="none" opacity="0.9"/>

  <!-- Film reel spokes -->
  <circle cx="32" cy="32" r="6" fill="#e8c56d"/>
  <circle cx="32" cy="32" r="3" fill="#08080f"/>

  <!-- Spoke lines -->
  <line x1="32" y1="26" x2="32" y2="10" stroke="#e8c56d" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="32" y1="38" x2="32" y2="54" stroke="#e8c56d" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="26" y1="32" x2="10" y2="32" stroke="#e8c56d" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="38" y1="32" x2="54" y2="32" stroke="#e8c56d" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Diagonal spokes -->
  <line x1="27.8" y1="27.8" x2="16.5" y2="16.5" stroke="#e8c56d" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="36.2" y1="36.2" x2="47.5" y2="47.5" stroke="#e8c56d" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="36.2" y1="27.8" x2="47.5" y2="16.5" stroke="#e8c56d" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="27.8" y1="36.2" x2="16.5" y2="47.5" stroke="#e8c56d" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Film holes around ring (8 circles) -->
  <circle cx="32" cy="8"  r="3" fill="#e8c56d" opacity="0.85"/>
  <circle cx="32" cy="56" r="3" fill="#e8c56d" opacity="0.85"/>
  <circle cx="8"  cy="32" r="3" fill="#e8c56d" opacity="0.85"/>
  <circle cx="56" cy="32" r="3" fill="#e8c56d" opacity="0.85"/>
  <circle cx="13.4" cy="13.4" r="3" fill="#e8c56d" opacity="0.7"/>
  <circle cx="50.6" cy="50.6" r="3" fill="#e8c56d" opacity="0.7"/>
  <circle cx="50.6" cy="13.4" r="3" fill="#e8c56d" opacity="0.7"/>
  <circle cx="13.4" cy="50.6" r="3" fill="#e8c56d" opacity="0.7"/>

  <!-- Play triangle in center -->
  <polygon points="29,27 29,37 39,32" fill="#e8c56d" opacity="0.95"/>
</svg>
