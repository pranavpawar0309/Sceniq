services:
  - type: web
    name: sceniq-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: TMDB_API_KEY
        sync: false          # You'll set this manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your Vercel URL after deploying frontend
      - key: PYTHON_VERSION
        value: "3.11.0"
